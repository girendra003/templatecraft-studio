services:
  templatecraft:
    image: ghcr.io/girendra003/templatecraft-studio:latest
    build: .
    ports:
      - "127.0.0.1:8008:8008"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
