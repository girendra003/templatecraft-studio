name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.txt
      - run: npm ci && npm run build
        working-directory: frontend
      - run: |
          python tests/test_pdf_import.py
          python tests/test_document_edit.py
          python tests/test_stamp_editor.py
      - name: Build release image
        run: docker build -t templatecraft-ci .
      - name: Verify offline operation
        run: docker run --rm --network none --read-only --tmpfs /tmp:size=128m,mode=1777 --mount "type=bind,source=$PWD/tests,target=/app/tests,readonly" --entrypoint python templatecraft-ci tests/test_offline.py
      - name: Start read-only container
        run: docker run -d --name templatecraft-ci --read-only --tmpfs /tmp:size=128m,mode=1777 --cap-drop ALL --security-opt no-new-privileges:true -p 127.0.0.1:8020:8008 templatecraft-ci
      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8020/api/health; then exit 0; fi
            sleep 1
          done
          docker logs templatecraft-ci
          exit 1
      - name: Container API integration
        run: python tests/test_container.py
      - name: Browser workflows against the container
        working-directory: frontend
        env:
          BASE_URL: http://127.0.0.1:8020
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: |
          npm run test:landing
          npm run test:effects
          npm run test:e2e
      - name: Container logs
        if: failure()
        run: docker logs templatecraft-ci
